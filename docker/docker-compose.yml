# PhaseSpace tracker + RViz (ROS 2 Jazzy).
# Before first run on the host:  xhost +local:docker
# Run (from repo root):          docker compose -f docker/docker-compose.yml up --build
x-ros: &ros
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: phasespace-rviz
  network_mode: host   # UDP stream from the PhaseSpace server + DDS between services
  ipc: host
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  environment:
    - DISPLAY=${DISPLAY:-:0}
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

services:
  phasespace:
    <<: *ros
    volumes:
      # orientation references (--capture writes here)
      - ../phasespace_ros2/trackers:/ws/install/phasespace_ros2/share/phasespace_ros2/trackers
    command: >
      ros2 launch phasespace_ros2 phasespace.launch.py rviz:=false
      device:=${PHASESPACE_DEVICE:-cs-phasespace.cs.umn.edu}

  rviz:
    <<: *ros
    command: ros2 run rviz2 rviz2 -d /ws/install/phasespace_ros2/share/phasespace_ros2/rviz/phasespace.rviz
