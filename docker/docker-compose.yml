# PhaseSpace LED visualization in RViz (ROS 2 Humble).
# Before first run on the host:  xhost +local:docker
# Run (from repo root):          docker compose -f docker/docker-compose.yml up --build
x-ros: &ros
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: phasespace-rviz
  network_mode: host   # UDP stream from the PhaseSpace server + DDS between services
  ipc: host
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  environment:
    - DISPLAY=${DISPLAY:-:0}
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

services:
  phasespace:
    <<: *ros
    volumes:
      # licensed SMPL-X model: mounted read-only, never baked into the image
      - ${SMPLX_DIR:-${HOME}/Projects/HOVER/body_models/smplx}:/body_models:ro
      - ../trackers:/ws/trackers   # orientation references (--capture writes here)
    command: >
      python3 docker/phasespace_rviz.py
      --device=${PHASESPACE_DEVICE:-cs-phasespace.cs.umn.edu}
      --freq=60 --stream=udp
      --smplx=/body_models/SMPLX_NEUTRAL.npz

  rviz:
    <<: *ros
    command: rviz2 -d docker/phasespace.rviz
